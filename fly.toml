# fly launch --no-deploy  then  fly deploy
app = "insight-blog"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DEBUG = "False"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
