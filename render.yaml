# One-click deploy on Render's free tier: web service + free Postgres.
# See DEPLOY.md for the click-by-click version.
services:
  - type: web
    name: insight-blog
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_SSL_REQUIRE
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: insight-db
          property: connectionString

databases:
  - name: insight-db
    plan: free
    databaseName: insight
    user: insight
